<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>thatskywidgets</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f7fb;
            --card: #ffffff;
            --card-border: rgba(15, 23, 42, 0.1);
            --text: #0f172a;
            --muted: #5b6475;
            --accent: #2563eb;
            --accent-bg: rgba(37, 99, 235, 0.08);
            --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: "Segoe UI Variable", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        .page {
            position: relative;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
        }

        .panel {
            width: min(920px, 100%);
            padding: 28px;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: var(--card);
            box-shadow: var(--shadow);
        }

        .hero {
            display: grid;
            gap: 10px;
            text-align: left;
            margin-bottom: 20px;
        }

        .primary-step {
            display: grid;
            gap: 8px;
            margin-bottom: 16px;
        }

        .primary-step-link {
            display: block;
            padding: 18px;
            border: 1px solid rgba(37, 99, 235, 0.28);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.06), rgba(255, 255, 255, 1));
            color: var(--text);
            text-decoration: none;
        }

        .primary-step-note {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .primary-step-note a {
            color: var(--accent);
            text-decoration: none;
            border: 0;
            background: none;
            padding: 0;
            min-height: 0;
            display: inline;
            box-shadow: none;
            transition: none;
        }

        .primary-step-note a:hover {
            text-decoration: underline;
            transform: none;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.7rem, 3vw, 2.4rem);
            line-height: 1.15;
        }

        .summary {
            margin: 0;
            max-width: 64ch;
            color: var(--muted);
            font-size: 0.98rem;
            line-height: 1.65;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        a {
            position: relative;
            display: flex;
            min-height: 88px;
            padding: 16px 16px 16px 18px;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 1));
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        a:hover {
            transform: translateY(-1px);
            border-color: rgba(37, 99, 235, 0.24);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        a:active {
            transform: translateY(0);
        }

        .card-title {
            display: block;
            font-size: 1rem;
            font-weight: 650;
            line-height: 1.35;
        }

        .card-desc {
            display: block;
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .card-meta {
            margin-top: auto;
            padding-top: 14px;
            color: var(--accent);
            font-size: 0.8rem;
        }

        .primary {
            border-color: rgba(37, 99, 235, 0.28);
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.06), rgba(255, 255, 255, 1));
        }

        .footer {
            margin-top: 22px;
            color: var(--muted);
            font-size: 0.86rem;
            text-align: left;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1020;
                --card: #111827;
                --card-border: rgba(255, 255, 255, 0.06);
                --text: #f3f4f6;
                --muted: #a8b0be;
                --accent: #60a5fa;
                --accent-bg: rgba(96, 165, 250, 0.12);
                --shadow: 0 16px 36px rgba(0, 0, 0, 0.36);
            }

            a {
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.015));
                border-color: rgba(255, 255, 255, 0.06);
            }

            .primary {
                background: linear-gradient(180deg, rgba(96, 165, 250, 0.14), rgba(255, 255, 255, 0.02));
            }

            /* 深色模式：提高主步骤卡片的对比度与可读性 */
            .primary-step-link {
                border-color: rgba(96, 165, 250, 0.28);
                background: linear-gradient(180deg, rgba(96, 165, 250, 0.06), rgba(255, 255, 255, 0.01));
                color: var(--text);
            }

            .primary-step-note {
                color: var(--muted);
            }

            .primary-step-note a {
                color: var(--accent);
                text-decoration: none;
            }

            .primary-step-note a:hover {
                text-decoration: underline;
            }

            a:hover {
                box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
            }
        }

        @media (max-width: 720px) {
            .panel {
                padding: 20px;
                border-radius: 18px;
            }

            .primary-step-link {
                padding: 16px;
            }

            .links {
                grid-template-columns: 1fr;
            }

            a {
                min-height: 84px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="panel">
            <div class="hero">
                <h1>thatskywidgets</h1>
                <p class="summary">先装 Scriptable，再安装脚本</p>
            </div>

            <div class="primary-step">
                <a class="primary-step-link" href="https://apps.apple.com/app/scriptable/id1405459188">
                    <span class="card-title">安装 Scriptable</span>
                    <span class="card-desc">请先安装 Scriptable 软件</span>
                </a>
                <div class="primary-step-note"><a href="https://scriptable.app/">Scriptable 官网</a></div>
            </div>

            <div class="links">
                <a class="primary" href="https://www.icloud.com/shortcuts/2d886ef3cb56488186d2208727438a7b">
                    <span>
                        <span class="card-title">快捷指令安装器</span>
                        <span class="card-desc">通过 iCloud 分享获取</span>
                        <span class="card-meta">推荐</span>
                    </span>
                </a>

                <a
                    href="https://open.scriptable.app/run/Installer?url=https%3A%2F%2Fsky-quests.shhy.in%2FSky%2520Quests.js">
                    <span>
                        <span class="card-title">使用 Installer 安装</span>
                        <span class="card-desc">仅适用于 Installer 用户</span>
                        <span class="card-meta">一键快捷安装</span>
                    </span>
                </a>

                <a href="Install Sky Quests Script.shortcut">
                    <span>
                        <span class="card-title">快捷指令安装器</span>
                        <span class="card-desc">通过下载文件获取</span>
                        <span class="card-meta">备用</span>
                    </span>
                </a>

                <a href="Sky Quests.js">
                    <span>
                        <span class="card-title">获取源码</span>
                        <span class="card-desc">源码下载</span>
                        <span class="card-meta">手动安装</span>
                    </span>
                </a>
            </div>

            <div class="footer">脚本只能运行在 Scriptable 上</div>
        </section>
    </main>
</body>

</html>
